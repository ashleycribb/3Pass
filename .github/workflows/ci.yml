name: 3Pass CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout 3Pass
        uses: actions/checkout@v4

      - name: Checkout S3A Storage Engine
        uses: actions/checkout@v4
        with:
          repository: ashleycribb/s3a-storage
          ref: 1c1b2b9428ff36cd4e6e92cfee79c054275315f5
          path: s3a

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build s3a-cli binary
        run: |
          cargo build -p s3a-cli --manifest-path s3a/Cargo.toml
          echo "$PWD/s3a/target/debug" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "S3A_BINARY_PATH=$PWD/s3a/target/debug/s3a-cli.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Wiki Linter
        run: |
          python scripts/wiki_manager.py --lint
