name: 3Pass CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      grobid:
        image: lfoppiano/grobid:0.8.1
        ports:
          - 8070:8070
        env:
          JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
          JAVA_OPTS: "-XX:-UseContainerSupport"
        options: --init

    steps:
      - name: Checkout 3Pass
        uses: actions/checkout@v4

      - name: Checkout S3A Storage Engine
        uses: actions/checkout@v4
        with:
          repository: ashleycribb/s3a-storage
          ref: 1c1b2b9428ff36cd4e6e92cfee79c054275315f5
          path: s3a

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build s3a-cli binary
        run: |
          cargo build -p s3a-cli --manifest-path s3a/Cargo.toml
          echo "$GITHUB_WORKSPACE/s3a/target/debug" >> $GITHUB_PATH
          echo "S3A_BINARY_PATH=$GITHUB_WORKSPACE/s3a/target/debug/s3a-cli" >> $GITHUB_ENV

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for GROBID Service
        run: |
          echo "Waiting for GROBID service container at http://localhost:8070..."
          for i in {1..30}; do
            if curl -s http://localhost:8070/api/isalive | grep -q "true"; then
              echo "GROBID is alive!"
              echo -n "GROBID Version: "
              curl -s http://localhost:8070/api/version
              echo ""
              break
            fi
            echo "Waiting for GROBID ($i/30)..."
            sleep 2
          done
          if ! curl -s http://localhost:8070/api/isalive | grep -q "true"; then
            echo "Error: GROBID service failed to become ready within 60 seconds."
            docker ps -a
            exit 1
          fi

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Run Wiki Linter
        run: |
          python scripts/wiki_manager.py --lint

      - name: Run Real-Paper Smoke Test (Live GROBID & Publisher XML)
        run: |
          python scripts/smoke_test_real_papers.py

  verified-pdf-e2e:
    # Optional heavy job: real Docling conversion of the synthetic fixture, then the full verified-PDF tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 3Pass
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies (CPU torch + Docling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-verified-pdf.txt

      - name: Run Verified PDF Tests (including Docling end-to-end)
        run: |
          python -m pytest tests/test_verified_pdf.py -v
